<div class="container py-4">
    <div class="row g-4">

        <!-- Card 1 -->
        <div class="col-md-4">
            <div class="card fiori-card p-3">
                <!-- <div class="d-flex align-items-center mb-3">
                    <div class="fiori-icon me-3"><i class="bi-person-workspace"></i></div>
                    <div class="fiori-header">Dial Pad</div>
                  </div> -->

                <div class="dial-container text-center">

                    <!-- Display -->
                    <input type="text" id="display" class="form-control display">

                    <!-- Dial buttons -->
                    <div class="row g-2">
                        <div class="col-4"><button class="btn btn-light w-100 btn-dial">1</button></div>
                        <div class="col-4"><button class="btn btn-light w-100 btn-dial">2</button></div>
                        <div class="col-4"><button class="btn btn-light w-100 btn-dial">3</button></div>

                        <div class="col-4"><button class="btn btn-light w-100 btn-dial">4</button></div>
                        <div class="col-4"><button class="btn btn-light w-100 btn-dial">5</button></div>
                        <div class="col-4"><button class="btn btn-light w-100 btn-dial">6</button></div>

                        <div class="col-4"><button class="btn btn-light w-100 btn-dial">7</button></div>
                        <div class="col-4"><button class="btn btn-light w-100 btn-dial">8</button></div>
                        <div class="col-4"><button class="btn btn-light w-100 btn-dial">9</button></div>

                        <div class="col-4"><button class="btn btn-light w-100 btn-dial">*</button></div>
                        <div class="col-4"><button class="btn btn-light w-100 btn-dial">0</button></div>
                        <div class="col-4"><button class="btn btn-light w-100 btn-dial">#</button></div>
                    </div>

                    <!-- Actions -->
                    <div class="row mt-3 g-2">
                        <div class="col-6">
                            <button class="btn btn-danger w-100 call-btn" onclick="backspace()"><i
                                    class="bi bi-backspace"></i></button>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-success w-100 call-btn" onclick="call()"><i
                                    class="bi bi-telephone-fill"></i></button>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

</div>
